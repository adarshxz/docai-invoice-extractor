[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docai"
version = "0.1.0"
description = "Multi-modal document & invoice entity extraction with LayoutLMv3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "torch>=2.2",
    "transformers>=4.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "celery[redis]>=5.3",
    "redis>=5.0",
]

[project.optional-dependencies]
train = ["datasets>=2.18", "accelerate>=0.29", "seqeval>=1.2"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
docai-extract = "docai.cli:main"
docai-train = "docai.training.train:main"
docai-data = "docai.data.cli:main"
docai-eval = "docai.training.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = ["slow: needs the LayoutLMv3 weights (network on first run)"]
